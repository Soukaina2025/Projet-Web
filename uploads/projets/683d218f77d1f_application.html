<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Securelle - Protection Féminine</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <style>
        :root {
            --primary-color: #9c27b0;  /* Mauve profond */
            --secondary-color: #e91e63; /* Rose vif */
            --accent-color: #ff80ab;   /* Rose clair */
            --light-color: #fce4ec;    /* Rose très clair */
            --dark-color: #6a1b9a;     /* Mauve foncé */
            --safe-color: #4caf50;     /* Vert doux */
            --warning-color: #ff9800;   /* Orange doux */
            --danger-color: #f44336;    /* Rouge doux */
            --text-color: #4a148c;      /* Violet foncé pour texte */
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-color);
            color: var(--text-color);
            padding-bottom: 80px;
        }
        
        .navbar {
            background-color: white;
            box-shadow: 0 2px 10px rgba(156, 39, 176, 0.1);
        }
        
        .navbar-brand {
            font-weight: 700;
            color: var(--primary-color) !important;
            font-family: 'Arial Rounded MT Bold', sans-serif;
        }
        
        .nav-tabs .nav-link {
            color: var(--dark-color);
            border: none;
            padding: 10px 15px;
            font-weight: 500;
        }
        
        .nav-tabs .nav-link.active {
            color: var(--secondary-color);
            border-bottom: 3px solid var(--secondary-color);
            background-color: transparent;
        }
        
        .status-card {
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(156, 39, 176, 0.1);
            margin-bottom: 20px;
            border: none;
            transition: transform 0.3s, box-shadow 0.3s;
            background-color: white;
            overflow: hidden;
            border-top: 4px solid var(--accent-color);
        }
        
        .status-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(156, 39, 176, 0.15);
        }
        
        .card-header {
            background-color: white;
            border-bottom: 1px solid rgba(233, 30, 99, 0.1);
            font-weight: 600;
            color: var(--primary-color);
        }
        
        .status-indicator {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }
        
        .status-safe {
            background-color: var(--safe-color);
        }
        
        .status-warning {
            background-color: var(--warning-color);
        }
        
        .status-danger {
            background-color: var(--danger-color);
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .vital-stat {
            font-size: 1.1rem;
        }
        
        .vital-icon {
            font-size: 1.5rem;
            margin-right: 10px;
            color: var(--primary-color);
        }
        
        .ai-message {
            background-color: white;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
            position: relative;
            box-shadow: 0 3px 10px rgba(233, 30, 99, 0.1);
            border-left: 4px solid var(--accent-color);
        }
        
        .ai-message:after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 20px;
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: white transparent;
        }
        
        .device-icon {
            font-size: 2.5rem;
            color: var(--primary-color);
            margin-bottom: 15px;
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .emergency-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            font-size: 24px;
            box-shadow: 0 4px 20px rgba(233, 30, 99, 0.3);
            z-index: 1000;
            background: linear-gradient(45deg, var(--secondary-color), var(--primary-color));
            border: none;
            color: white;
            transition: all 0.3s;
        }
        
        .emergency-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(233, 30, 99, 0.4);
        }
        
        .settings-section {
            background-color: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(156, 39, 176, 0.1);
            border-top: 3px solid var(--accent-color);
        }
        
        .battery-level {
            height: 15px;
            border-radius: 10px;
            background: linear-gradient(to right, var(--danger-color), var(--warning-color), var(--safe-color));
        }
        
        .progress-bar {
            background-color: var(--safe-color);
        }
        
        /* Styles pour les contacts */
        .contact-list {
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 20px;
            padding-right: 10px;
        }
        
        .contact-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            margin-bottom: 10px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(156, 39, 176, 0.1);
            transition: all 0.3s;
            border-left: 4px solid var(--accent-color);
        }
        
        .contact-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(156, 39, 176, 0.15);
        }
        
        .contact-info {
            flex-grow: 1;
        }
        
        .contact-name {
            font-weight: 600;
            color: var(--dark-color);
            margin-bottom: 3px;
        }
        
        .contact-phone {
            font-size: 0.9rem;
            color: var(--primary-color);
        }
        
        .contact-actions {
            display: flex;
            gap: 8px;
        }
        
        .btn-contact {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            padding: 0;
            border: none;
            transition: all 0.2s;
        }
        
        .btn-call {
            background-color: rgba(76, 175, 80, 0.1);
            color: var(--safe-color);
        }
        
        .btn-call:hover {
            background-color: var(--safe-color);
            color: white;
        }
        
        .btn-alert {
            background-color: rgba(244, 67, 54, 0.1);
            color: var(--danger-color);
        }
        
        .btn-alert:hover {
            background-color: var(--danger-color);
            color: white;
        }
        
        .btn-delete {
            background-color: rgba(106, 27, 154, 0.1);
            color: var(--dark-color);
        }
        
        .btn-delete:hover {
            background-color: var(--dark-color);
            color: white;
        }
        
        .add-contact-form {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(156, 39, 176, 0.1);
            margin-bottom: 20px;
            border-top: 3px solid var(--accent-color);
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
        
        .btn-primary:hover {
            background-color: var(--dark-color);
            border-color: var(--dark-color);
        }
        
        .btn-outline-primary {
            color: var(--primary-color);
            border-color: var(--primary-color);
        }
        
        .btn-outline-primary:hover {
            background-color: var(--primary-color);
            color: white;
        }
        
        .alert-success {
            background-color: rgba(76, 175, 80, 0.1);
            border-color: rgba(76, 175, 80, 0.3);
            color: var(--text-color);
        }
        
        .alert-warning {
            background-color: rgba(255, 152, 0, 0.1);
            border-color: rgba(255, 152, 0, 0.3);
            color: var(--text-color);
        }
        
        .modal-header {
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            color: white;
        }
        
        /* Barre de défilement stylisée */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #fce4ec;
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--accent-color);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--secondary-color);
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="bi bi-shield-heart"></i> Securelle
            </a>
            <div class="d-flex align-items-center">
                <span class="badge rounded-pill" style="background-color: var(--accent-color); color: white;" class="me-3">
                    <i class="bi bi-check-circle-fill me-1"></i>Connecté
                </span>
                <button class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-box-arrow-right"></i>
                </button>
            </div>
        </div>
    </nav>

    <script>

    </script>
</body>
</html>
